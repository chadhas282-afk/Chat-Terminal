<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_CORE_v4.0</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --cyan: #58a6ff;
            --dim: #8b949e;
            --red: #ff4b4b;
        }

        .theme-matrix {
            --bg: #000;
            --panel: #050505;
            --border: #00ff41;
            --text: #00ff41;
            --cyan: #00ff41;
            --dim: #008f11;
        }

        .theme-blood {
            --bg: #1a0000;
            --panel: #2a0000;
            --border: #ff0000;
            --text: #ff9999;
            --cyan: #ff0000;
            --dim: #660000;
        }

        .theme-nord {
            --bg: #2e3440;
            --panel: #3b4252;
            --border: #88c0d0;
            --text: #eceff4;
            --cyan: #81a1c1;
            --dim: #4c566a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'SF Mono', 'Fira Code', monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: 0.2s;
        }

        #login-gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .gate-box {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 320px;
        }

        #app {
            display: none;
            width: 100vw;
            height: 100vh;
            grid-template-columns: 260px 1fr;
        }

        #sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #chat-main {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            flex: 1;
            min-width: 0;
            height: 100vh;
            position: relative;
        }

        #log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
             min-height: 0;
        }

        #log::-webkit-scrollbar {
            width: 8px;
        }

         #log::-webkit-scrollbar-track {
            background: var(--bg);
        }

        #log::-webkit-scrollbar-thumb {
             background: var(--border);
            border-radius: 10px;
        }

        .msg {
             margin-bottom: 10px;
            font-size: 14px;
            word-wrap: break-word;
             flex-shrink: 0;
            line-height: 1.4;
        }
