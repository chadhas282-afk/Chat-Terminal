<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_CORE_v4.0</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --cyan: #58a6ff;
            --dim: #8b949e;
            --red: #ff4b4b;
        }

        .theme-matrix {
            --bg: #000;
            --panel: #050505;
            --border: #00ff41;
            --text: #00ff41;
            --cyan: #00ff41;
            --dim: #008f11;
        }

        .theme-blood {
            --bg: #1a0000;
            --panel: #2a0000;
            --border: #ff0000;
            --text: #ff9999;
            --cyan: #ff0000;
            --dim: #660000;
        }

        .theme-nord {
            --bg: #2e3440;
            --panel: #3b4252;
            --border: #88c0d0;
            --text: #eceff4;
            --cyan: #81a1c1;
            --dim: #4c566a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'SF Mono', 'Fira Code', monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: 0.2s;
        }

        #login-gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .gate-box {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 320px;
        }

        #app {
            display: none;
            width: 100vw;
            height: 100vh;
            grid-template-columns: 260px 1fr;
        }

        #sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #chat-main {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            flex: 1;
            min-width: 0;
            height: 100vh;
            position: relative;
        }

        #log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            min-height: 0;
        }

        #log::-webkit-scrollbar {
            width: 8px;
        }

        #log::-webkit-scrollbar-track {
            background: var(--bg);
        }

        #log::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .msg {
            margin-bottom: 10px;
            font-size: 14px;
            word-wrap: break-word;
            flex-shrink: 0;
            line-height: 1.4;
        }

        .u-tag {
            color: var(--cyan);
            font-weight: bold;
        }

        .root-tag {
            color: var(--red);
            border: 1px solid var(--red);
            font-size: 10px;
            padding: 0 4px;
            margin-right: 5px;
            font-weight: bold;
        }

        .terminal-img {
            max-width: 100%;
            max-height: 350px;
            border: 1px solid var(--border);
            margin: 8px 0;
            border-radius: 4px;
            display: block;
        }

        .input-area {
            padding: 15px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
        }

        input {
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            margin: 5px 0;
            box-sizing: border-box;
        }

        #cmd {
            background: transparent;
            border: none;
            flex: 1;
            color: var(--text);
            font-size: 16px;
            margin: 0 10px;
        }

        .btn-logout {
            margin-top: auto;
            border: 1px solid var(--red);
            color: var(--red);
            background: none;
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        @media (max-width: 768px) {
            #app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }

            #sidebar {
                padding: 10px 15px;
                flex-direction: row;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                justify-content: space-between;
                align-items: center;
            }

            #sidebar h4,
            #member-list {
                display: none;
            }

            #sidebar h4:first-child {
                display: block;
                margin: 0;
                font-size: 12px;
            }

            .btn-logout {
                margin: 0;
                padding: 4px 8px;
                font-size: 10px;
            }

            #log {
                padding: 15px;
            }

            .msg {
                font-size: 13px;
            }

            .gate-box {
                width: 85%;
            }
        }
    </style>
</head>

<body>

    <div id="login-gate">
        <div class="gate-box">
            <h2 style="color:var(--cyan); margin-top:0;">SYSTEM_BOOT</h2>
            <input type="text" id="user" placeholder="USERNAME" autofocus>
            <input type="password" id="pass" placeholder="ACCESS_KEY">
            <input type="text" id="room" placeholder="ROOM_CODE">
            <button onclick="boot()"
                style="background:var(--cyan); border:none; padding:12px; width:100%; margin-top:10px; cursor:pointer; font-weight:bold; color:#000;">INITIALIZE</button>
        </div>
    </div>

    <div id="app">
         <div id="sidebar">
            <h4 style="color:var(--dim)">ID: <span id="my-name" style="color:var(--cyan)">---</span></h4>
            <h4 style="margin-top:30px; color:var(--dim)">MEMBERS</h4>
            <div id="member-list" style="flex: 1; font-size: 13px;"></div>
            <button class="btn-logout" onclick="logout()">SHUTDOWN</button>
        </div>
        <div id="chat-main">
            <div id="load-more" onclick="loadOlder()"
                style="text-align:center; padding:10px; color:var(--cyan); cursor:pointer; display:none; font-size:12px;">
                [LOAD_PREVIOUS]</div>
            <div id="log"></div>
            <div id="status-bar" style="padding:0 20px; height:18px; font-size:11px; color:var(--dim);"></div>
            <div class="input-area">
                <label for="img-in"
                    style="color:var(--dim); cursor:pointer; font-weight:bold; padding: 5px;">[+]</label>
                <input type="file" id="img-in" accept="image/*" style="display:none">
                <span style="color:var(--cyan); font-weight:bold;">➜</span>
                 <input type="text" id="cmd" placeholder="Type /help..." autocomplete="off">
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
         const socket = io({ autoConnect: false });
        const log = document.getElementById('log'), cmdInput = document.getElementById('cmd');
        let roomCode = '', myName = '', isRoot = false, currentSkip = 0;
        const observer = new MutationObserver(() => {
             const threshold = 150;
            const isAtBottom = log.scrollHeight - log.scrollTop - log.clientHeight <= threshold;
            if (isAtBottom) log.scrollTop = log.scrollHeight;
        });
        observer.observe(log, { childList: true, subtree: true });
        window.onload = async () => {
            const theme = localStorage.getItem('termTheme');
            if (theme) document.body.className = theme;
            const res = await fetch('/api/me');
               if (res.ok) { const d = await res.json(); setupUI(d.username, d.isAdmin); }
            else { document.getElementById('login-gate').style.display = 'flex'; }
        };

        async function boot() {
            const u = document.getElementById('user').value, p = document.getElementById('pass').value;
            roomCode = document.getElementById('room').value.toUpperCase() || 'GENERAL';
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
            if (res.ok) { const data = await res.json(); localStorage.setItem('lastRoom', roomCode); setupUI(data.username, data.isAdmin); }
            else alert("ACCESS_DENIED");
        }

         function setupUI(u, root) {
            myName = u; isRoot = root;
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('app').style.display = 'grid';
            document.getElementById('my-name').innerText = u.toLowerCase();
            roomCode = localStorage.getItem('lastRoom') || 'GENERAL';
            socket.connect(); socket.emit('joinRoom', { roomCode, skip: 0 });
        }

        function addLine(user, text, image, id, rootUser, isHistory = false) {
            const div = document.createElement('div'); div.className = 'msg'; if (id) div.id = `m-${id}`;
            const time = `<span style="color:var(--dim); font-size:10px;">[${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}] </span>`;
            const rootTag = rootUser ? `<span class="root-tag">ROOT</span>` : '';
            const actions = (user === myName || isRoot) ? `<span onclick="delM('${id}')" style="color:var(--red); cursor:pointer; margin-left:8px; font-size:10px;">[DEL]</span>` : '';
             let contentHtml = `${time}${rootTag}<span class="u-tag">${user}:</span> <span>${text}</span>`;
            if (image) contentHtml += `<img src="${image}" class="terminal-img" onload="log.scrollTop = log.scrollHeight">`;

            div.innerHTML = contentHtml + actions;
            if (isHistory) {
                observer.disconnect();
                log.prepend(div);
                observer.observe(log, { childList: true, subtree: true });
            } else {
                log.appendChild(div);
            }
        }

         function loadOlder() { currentSkip += 30; socket.emit('joinRoom', { roomCode, skip: currentSkip }); }
        function delM(id) { socket.emit('deleteMessage', { messageId: id, roomCode }); }

        async function logout() { await fetch('/api/logout', { method: 'POST' }); localStorage.removeItem('lastRoom'); window.location.reload(); }

        cmdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && cmdInput.value.trim()) {
